<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EliteCode AI</title>
<link rel="stylesheet" href="style.css">
<!-- Marked.js for markdown -->
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<style>
  body { padding: 0; margin: 0; overflow: hidden; background: transparent; }
  #ai-panel { width: 100%; height: 100vh; position: relative; display: flex; flex-direction: column; background: var(--vscode-sideBar-background); color: var(--vscode-sideBarTitle-foreground); }
  .ai-header { padding: 12px; border-bottom: 1px solid var(--vscode-sideBarSectionHeader-border); }
  .ai-title-row { display: flex; align-items: center; gap: 8px; }
  .ai-logo { font-size: 20px; }
  .ai-name { font-weight: 600; font-size: 14px; }
  .ai-model { font-size: 11px; opacity: 0.7; }
  .ai-header-actions { margin-left: auto; display: flex; gap: 4px; }
  .ai-icon-btn { background: none; border: none; cursor: pointer; padding: 4px; border-radius: 4px; color: inherit; }
  .ai-icon-btn:hover { background: var(--vscode-toolbar-hoverBackground); }
  
  .mode-row { display: flex; gap: 4px; overflow-x: auto; margin-top: 12px; padding-bottom: 4px; }
  .mode-btn { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; white-space: nowrap; }
  .mode-btn.active { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  
  #ai-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; flex-direction: column; gap: 4px; }
  .msg-header { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; }
  .msg-avatar { width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; }
  .msg-avatar.ai { background: #4ec9b0; color: #000; }
  .msg-avatar.user { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  .msg-bubble { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; }
  .msg-bubble.user { background: var(--vscode-editor-background); border: 1px solid var(--vscode-editorGroup-border); }
  .msg-bubble.ai { background: transparent; }
  
  .ai-input-area { padding: 12px; border-top: 1px solid var(--vscode-sideBarSectionHeader-border); }
  .ai-input-wrapper { background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border); border-radius: 6px; display: flex; flex-direction: column; }
  #ai-input { background: transparent; border: none; color: var(--vscode-input-foreground); padding: 8px; outline: none; resize: none; font-family: inherit; font-size: 13px; }
  .ai-input-actions { display: flex; align-items: center; padding: 4px 8px; border-top: 1px solid var(--vscode-input-border); gap: 4px; }
  .ai-attach-btn { background: none; border: none; color: var(--vscode-icon-foreground); cursor: pointer; padding: 4px; border-radius: 4px; }
  .ai-attach-btn:hover { background: var(--vscode-toolbar-hoverBackground); }
  .ai-input-hint { flex: 1; font-size: 11px; color: var(--vscode-input-placeholderForeground); text-align: center; }
  .ai-send-btn { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 4px; }
  
  pre { background: var(--vscode-editor-background) !important; padding: 12px; border-radius: 6px; overflow-x: auto; }
  code { font-family: 'Courier New', Courier, monospace; }
  .code-block-wrap { position: relative; margin: 8px 0; }
  .code-copy-btn, .send-to-editor-btn { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: 1px solid var(--vscode-button-border, transparent); padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 4px; }
  
  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
  .modal { background: var(--vscode-editor-background); padding: 24px; border-radius: 8px; width: 90%; max-width: 300px; border: 1px solid var(--vscode-editorGroup-border); }
  .modal-input { width: 100%; box-sizing: border-box; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border); padding: 8px; margin: 12px 0; outline: none; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .btn-primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); border: none; padding: 6px 12px; cursor: pointer; border-radius: 2px; }
  .btn-secondary { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: none; padding: 6px 12px; cursor: pointer; border-radius: 2px; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <!-- AI Panel -->
  <div id="ai-panel">
    <div class="ai-header">
      <div class="ai-title-row">
        <div class="ai-logo">⚡</div>
        <div>
          <div class="ai-name">Elite AI Assistant</div>
          <div class="ai-model" id="ai-mode-label">NORMAL MODE · Local AI</div>
        </div>
        <div class="ai-header-actions">
          <button class="ai-icon-btn" onclick="ideApp.clearChat()" title="Clear chat">🗑️</button>
          <button class="ai-icon-btn" onclick="ideApp.openSettings()" title="API Key">🔑</button>
        </div>
      </div>
      <div class="mode-row" id="mode-row"></div>
      
      <!-- Auto-Learning Status -->
      <div style="font-size: 11px; margin-top: 8px; display: flex; align-items: center; gap: 4px; color: var(--vscode-charts-green);">
         🧠 <span id="learning-text">AI Hazır</span>
      </div>
    </div>

    <div id="ai-messages"></div>

    <div class="ai-input-area">
      <div class="ai-input-wrapper">
        <textarea id="ai-input" placeholder="Ask anything... (Ctrl+Enter to send)" rows="3"
          onkeydown="ideApp.aiInputKey(event)" oninput="ideApp.autoResize(this)"></textarea>
        <div class="ai-input-actions">
          <button class="ai-attach-btn" onclick="ideApp.insertActiveCode()" title="Insert active editor code">📋</button>
          <span class="ai-input-hint" id="ai-hint">Ask anything...</span>
          <button class="ai-send-btn" id="ai-send-btn" onclick="ideApp.sendMessage()">
            Send
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- API Key Modal -->
  <div class="modal-overlay hidden" id="api-modal">
    <div class="modal">
      <h3 style="margin-top:0">🔑 Configure API Key</h3>
      <p style="font-size:12px">Enter your Google Gemini API key to enable the AI assistant.<br>
      Get a free key at <strong>aistudio.google.com</strong></p>
      <input class="modal-input" id="api-key-input" type="password" placeholder="AIza..." autocomplete="off">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="ideApp.closeModal()">Cancel</button>
        <button class="btn-primary" onclick="ideApp.saveApiKey()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // Initialize VS Code API
    const vscode = acquireVsCodeApi();
  </script>
  <script src="local-ai.js"></script>
  <script src="ai-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
